<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vesimittarin kuukausiraportti</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root { --fg: #16232b; --muted: #5d6f79; --line: #d3dde2; --cold: #1f6fb2; --hot: #c8402c; --bg: #eef2f4; --surface: #ffffff; --cold-soft: #dcebf7;
  --f-digit: "Barlow Condensed", "Arial Narrow", sans-serif; --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
[hidden] { display: none !important; }
.bar { position: static; }
.bar { max-width: 760px; margin: 0 auto 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.bar a { color: var(--cold); font-weight: 600; text-decoration: none; }
.ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.bar input[type=date] { font: 500 15px var(--f-body); padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--fg); }
.trend svg { width: 100%; height: auto; display: block; }
.trend text { fill: var(--muted); font: 11px var(--f-body); font-variant-numeric: tabular-nums; }
.trend .lbl { fill: var(--fg); font-weight: 600; }
.trend h3 { font-size: 13px; margin: 10px 0 2px; display: flex; align-items: center; }
.up { color: var(--hot); } .down { color: #2e7d4f; }
.bar select { font: 500 15px var(--f-body); padding: 9px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--fg); }
.btn { font: 600 15px var(--f-body); border-radius: 10px; padding: 11px 16px; border: 0; background: var(--cold); color: #fff; cursor: pointer; }
.paper { max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 28px 28px 32px; }
h1 { font: 700 28px/1.1 var(--f-digit); margin: 0; }
.sub { color: var(--muted); margin: 4px 0 20px; font-size: 13px; }
h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 11px; color: var(--muted); font-weight: 600; }
tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--fg); }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.c { background: var(--cold); } .h { background: var(--hot); }
.daily td, .daily th { padding: 3px 6px; font-size: 12px; }
.wknd td:first-child { color: var(--muted); }
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 4px; }
.big div { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.big b { display: block; font: 600 26px/1.1 var(--f-digit); font-variant-numeric: tabular-nums; }
.big small { color: var(--muted); font-size: 12px; }
.scroll { overflow-x: auto; }
.foot { margin-top: 20px; color: var(--muted); font-size: 11px; }
.hint { max-width: 760px; margin: 10px auto 0; color: var(--muted); font-size: 13px; }
@media (max-width: 520px) { .paper { padding: 18px 14px; } .big { grid-template-columns: 1fr 1fr; } }
@page { size: A4; margin: 14mm; }
@media print {
  body { background: #fff; padding: 0; }
  .bar, .hint { display: none !important; }
  .paper { border: 0; padding: 0; max-width: none; }
  .scroll { overflow: visible; }
  tr, .tchart { break-inside: avoid; }
}

/* --- app chrome --- */
html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
body { padding-top: 0 !important; padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)) !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--bg); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 8px calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg); border-bottom: 1px solid transparent; transition: border-color .2s; }
.appbar.scrolled { border-bottom-color: var(--line); }
.appbar h1 { font-family: var(--f-digit); font-weight: 700; font-size: 26px; margin: 0; line-height: 1.1; }
.appbar-in { max-width: 720px; width: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--muted); font: 600 11.5px var(--f-body); padding: 4px 0; user-select: none; }
.tabbar a svg { width: 22px; height: 22px; padding: 4px 18px; border-radius: 999px; box-sizing: content-box; transition: background .15s; }
.tabbar a[aria-current="page"] { color: var(--fg); }
.tabbar a[aria-current="page"] svg { background: var(--cold-soft, #dcebf7); color: var(--cold, #1f6fb2); }
.tabbar a:focus-visible { outline: 2px solid var(--cold, #1f6fb2); outline-offset: -2px; border-radius: 12px; }
button, .btn, .seg button { user-select: none; -webkit-user-select: none; }
.btn:active, .seg button:active, .ranges button:active { transform: scale(.98); }
.toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important; }
@media print { .appbar, .tabbar { display: none !important; } body { padding-bottom: 0 !important; } }
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in"><h1>Raportti</h1></div></header>
<div class="bar">
  <div class="ctl">
    <select id="mode" aria-label="Raportin tyyppi"><option value="kk">Kuukausi</option><option value="oma">Oma aikaväli</option></select>
    <select id="month" aria-label="Kuukausi"></select>
    <span id="range" hidden><input type="date" id="from" aria-label="Alkaen"> – <input type="date" id="to" aria-label="Päättyen"></span>
  </div>
  <button class="btn" type="button" id="pdf">Tallenna PDF</button>
</div>
<div class="paper" id="paper"></div>
<p class="hint">Tallenna PDF avaa tulostusikkunan. Valitse tulostimeksi <b>Tallenna PDF-tiedostona</b> ja paina latauskuvaketta.</p>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DAY = 86400000, MONTHS = ["tammikuu", "helmikuu", "maaliskuu", "huhtikuu", "toukokuu", "kesäkuu", "heinäkuu", "elokuu", "syyskuu", "lokakuu", "marraskuu", "joulukuu"];
  const toUTC = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const fromUTC = (t) => new Date(t).toISOString().slice(0, 10);
  const fiDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return d + "." + m + "." + y; };
  const fmt = (n, d) => n.toLocaleString("fi-FI", { minimumFractionDigits: d, maximumFractionDigits: d });
  const eur = (n) => fmt(n, 2) + " €";
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || "[]") || []; } catch (e) { return []; } };
  const all = read("vesimittari-lukemat").filter(r => r && (r.meter === "kylma" || r.meter === "lammin") && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && isFinite(r.value));
  const prices = read("vesimittari-hinnat").filter(p => p && /^\d{4}-\d{2}-\d{2}$/.test(p.from) && isFinite(p.price));
  const priceAt = (meter, day) => { let b = null; for (const p of prices) if (p.meter === meter && p.from <= day && (!b || p.from > b.from)) b = p; return b ? b.price : null; };

  function daily(meter) {
    const rs = all.filter(r => r.meter === meter).sort((a, b) => a.date < b.date ? -1 : 1), out = new Map();
    for (let i = 1; i < rs.length; i++) {
      const a = toUTC(rs[i - 1].date), n = Math.round((toUTC(rs[i].date) - a) / DAY);
      if (n <= 0) continue;
      const per = (rs[i].value - rs[i - 1].value) * 1000 / n;
      for (let k = 1; k <= n; k++) out.set(fromUTC(a + k * DAY), per);
    }
    return out;
  }
  const dc = daily("kylma"), dh = daily("lammin");
  const months = [...new Set([...dc.keys(), ...dh.keys(), ...all.map(r => r.date)].map(d => d.slice(0, 7)))].sort().reverse();

  const sel = $("month"), modeSel = $("mode");
  if (!months.length) { $("paper").innerHTML = "<h1>Ei tietoja</h1><p class='sub'>Raportti tarvitsee vähintään kaksi lukemaa. Tallenna lukemia etusivulla.</p>"; $("pdf").hidden = true; document.querySelector(".ctl").hidden = true; return; }
  for (const m of months) { const o = document.createElement("option"); const [y, mo] = m.split("-").map(Number); o.value = m; o.textContent = MONTHS[mo - 1] + " " + y; sel.append(o); }
  const allDays = [...new Set([...dc.keys(), ...dh.keys()])].sort();
  const q = new URLSearchParams(location.search);
  sel.value = months.includes(q.get("kk")) ? q.get("kk") : months[0];
  const lastDay = allDays[allDays.length - 1] || new Date().toISOString().slice(0, 10);
  $("to").value = q.get("loppu") || lastDay;
  $("from").value = q.get("alku") || (() => { const d = new Date(toUTC(lastDay)); d.setUTCMonth(d.getUTCMonth() - 2); d.setUTCDate(1); return fromUTC(d.getTime()); })();
  if (q.get("alku")) modeSel.value = "oma";
  function sync() {
    const oma = modeSel.value === "oma";
    sel.hidden = oma; $("range").hidden = !oma;
    history.replaceState(null, "", oma ? "?alku=" + $("from").value + "&loppu=" + $("to").value : "?kk=" + sel.value);
    render();
  }
  modeSel.onchange = sync; sel.onchange = sync; $("from").onchange = sync; $("to").onchange = sync;
  $("pdf").onclick = () => window.print();

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function row(cells, tag = "td") { const tr = document.createElement("tr"); for (const c of cells) { const td = document.createElement(tag); if (c instanceof Node) td.append(c); else td.textContent = c; tr.append(td); } return tr; }
  const label = (cls, t) => { const s = document.createElement("span"); s.append(el("span", "sw " + cls), t); return s; };
  const monthName = (m) => { const [y, mo] = m.split("-").map(Number); return MONTHS[mo - 1] + " " + y; };
  const costDay = (meter, map, d) => { const p = priceAt(meter, d), l = map.get(d); return p != null && l != null ? l / 1000 * p : 0; };

  function render() {
    let from, to, title;
    if (modeSel.value === "oma") {
      from = $("from").value; to = $("to").value;
      if (!from || !to) return;
      if (from > to) [from, to] = [to, from];
      title = "Vesimittarin raportti · " + fiDate(from) + "–" + fiDate(to);
    } else {
      const m = sel.value, [y, mo] = m.split("-").map(Number), n = new Date(Date.UTC(y, mo, 0)).getUTCDate();
      from = m + "-01"; to = m + "-" + String(n).padStart(2, "0");
      title = "Vesimittarin kuukausiraportti · " + monthName(m);
    }
    document.title = title.replace("Vesimittarin ", "Vesimittari ");
    const days = []; for (let t = toUTC(from); t <= toUTC(to); t += DAY) days.push(fromUTC(t));
    const hasP = prices.length > 0;
    const sum = (map, ds) => ds.reduce((s, d) => s + (map.get(d) || 0), 0);
    const cost = (meter, map, ds) => ds.reduce((s, d) => s + costDay(meter, map, d), 0);
    const covered = days.filter(d => dc.has(d) || dh.has(d));
    const lc = sum(dc, days), lh = sum(dh, days), ec = cost("kylma", dc, days), eh = cost("lammin", dh, days);

    const P = $("paper"); P.innerHTML = "";
    P.append(el("h1", "", title));
    P.append(el("p", "sub", "Jakso " + fiDate(from) + "–" + fiDate(to) + " (" + days.length + " vrk). Kulutusta laskettu " + covered.length + " päivälle. Tulostettu " + fiDate(new Date().toISOString().slice(0, 10)) + "."));

    const big = el("div", "big");
    const tile = (v, t) => { const d = el("div"); d.append(el("b", "", v), el("small", "", t)); big.append(d); };
    tile(fmt((lc + lh) / 1000, 3) + " m³", "Kulutus yhteensä");
    tile(covered.length ? fmt(Math.round((lc + lh) / covered.length), 0) + " l" : "–", "Keskimäärin vuorokaudessa");
    tile(hasP ? eur(ec + eh) : "–", hasP ? "Vesimaksut yhteensä" : "Hintoja ei syötetty");
    P.append(big);

    // Meters
    P.append(el("h2", "", "Mittarit"));
    const readsIn = (meter) => all.filter(r => r.meter === meter && r.date >= from && r.date <= to).sort((a, b) => a.date < b.date ? -1 : 1);
    const before = (meter) => all.filter(r => r.meter === meter && r.date < from).sort((a, b) => a.date < b.date ? -1 : 1).pop();
    const t1 = document.createElement("table");
    t1.append(row(["Mittari", "Alkulukema", "Loppulukema", "Kulutus m³", ...(hasP ? ["€ / m³", "Maksu"] : [])], "th"));
    for (const [meter, name, cls, l, e] of [["kylma", "Kylmä vesi", "c", lc, ec], ["lammin", "Lämmin vesi", "h", lh, eh]]) {
      const rin = readsIn(meter), b = before(meter) || rin[0], end = rin[rin.length - 1];
      const ps = [...new Set(days.map(d => priceAt(meter, d)).filter(p => p != null))];
      t1.append(row([label(cls, name), b ? fmt(b.value, 3) + " (" + fiDate(b.date) + ")" : "–", end ? fmt(end.value, 3) + " (" + fiDate(end.date) + ")" : "–", fmt(l / 1000, 3),
        ...(hasP ? [ps.length ? ps.map(p => fmt(p, 2)).join(" / ") : "–", eur(e)] : [])]));
    }
    const tf = document.createElement("tfoot"); tf.append(row(["Yhteensä", "", "", fmt((lc + lh) / 1000, 3), ...(hasP ? ["", eur(ec + eh)] : [])])); t1.append(tf);
    const s1 = el("div", "scroll"); s1.append(t1); P.append(s1);

    // Monthly grouping
    const groups = [];
    for (const d of days) { const k = d.slice(0, 7); let g = groups[groups.length - 1]; if (!g || g.k !== k) { g = { k, days: [] }; groups.push(g); } g.days.push(d); }
    for (const g of groups) {
      const [y, mo] = g.k.split("-").map(Number); g.full = g.days.length === new Date(Date.UTC(y, mo, 0)).getUTCDate();
      g.cov = g.days.filter(d => dc.has(d) || dh.has(d)).length;
      g.lc = sum(dc, g.days); g.lh = sum(dh, g.days); g.e = cost("kylma", dc, g.days) + cost("lammin", dh, g.days);
      const nc = g.days.filter(d => dc.has(d)).length, nh = g.days.filter(d => dh.has(d)).length;
      g.ac = nc ? g.lc / nc : null; g.ah = nh ? g.lh / nh : null; g.at = g.cov ? (g.lc + g.lh) / g.cov : null;
    }
    if (groups.length > 1) {
      P.append(el("h2", "", "Kuukausittain"));
      const t3 = document.createElement("table");
      t3.append(row(["Kuukausi", label("c", "Kylmä m³"), label("h", "Lämmin m³"), "Yhteensä m³", "l / vrk", "Muutos", ...(hasP ? ["Maksu"] : [])], "th"));
      let prev = null, partial = false;
      for (const g of groups) {
        let ch = "–", cls = "";
        if (prev != null && g.at != null && prev > 0) { const pct = Math.round((g.at / prev - 1) * 100); ch = (pct > 0 ? "+" : "") + pct + " %"; cls = pct > 0 ? "up" : pct < 0 ? "down" : ""; }
        const chEl = el("span", cls, ch);
        if (!g.full) partial = true;
        t3.append(row([monthName(g.k) + (g.full ? "" : " *"), fmt(g.lc / 1000, 3), fmt(g.lh / 1000, 3), fmt((g.lc + g.lh) / 1000, 3), g.at != null ? fmt(Math.round(g.at), 0) : "–", chEl, ...(hasP ? [eur(g.e)] : [])]));
        if (g.at != null) prev = g.at;
      }
      const tf3 = document.createElement("tfoot"); tf3.append(row(["Yhteensä", fmt(lc / 1000, 3), fmt(lh / 1000, 3), fmt((lc + lh) / 1000, 3), covered.length ? fmt(Math.round((lc + lh) / covered.length), 0) : "–", "", ...(hasP ? [eur(ec + eh)] : [])])); t3.append(tf3);
      const s3 = el("div", "scroll"); s3.append(t3); P.append(s3);
      P.append(el("p", "foot", "Muutos verrataan edellisen kuukauden keskikulutukseen (l/vrk), joten vajaatkin kuukaudet ovat vertailukelpoisia." + (partial ? " * Vajaa kuukausi: aikaväli rajaa tai lukemia puuttuu." : "")));

      // Trend charts
      const tr = el("div", "trend");
      tr.append(el("h2", "", "Kuukausitrendi, keskimäärin litraa vuorokaudessa"));
      for (const [key, name, cls, color] of [["ac", "Kylmä vesi", "c", "var(--cold)"], ["ah", "Lämmin vesi", "h", "var(--hot)"]]) {
        const box = el("div", "tchart"), h3 = el("h3"); h3.append(el("span", "sw " + cls), name); box.append(h3);
        box.insertAdjacentHTML("beforeend", trendSvg(groups, key, color)); tr.append(box);
      }
      P.append(tr);
    }

    // Daily table for short ranges
    if (days.length <= 31) {
      P.append(el("h2", "", "Päivittäinen kulutus, litraa"));
      const t2 = document.createElement("table"); t2.className = "daily";
      t2.append(row(["Päivä", label("c", "Kylmä"), label("h", "Lämmin"), "Yhteensä", ...(hasP ? ["€"] : [])], "th"));
      for (const d of days) {
        const c = dc.get(d), h = dh.get(d), wd = new Date(toUTC(d)).getUTCDay();
        const dcst = costDay("kylma", dc, d) + costDay("lammin", dh, d);
        const r = row([new Date(toUTC(d)).toLocaleDateString("fi-FI", { weekday: "short", timeZone: "UTC" }) + " " + fiDate(d),
          c != null ? fmt(Math.round(c), 0) : "–", h != null ? fmt(Math.round(h), 0) : "–",
          c != null || h != null ? fmt(Math.round((c || 0) + (h || 0)), 0) : "–", ...(hasP ? [c != null || h != null ? fmt(dcst, 2) : "–"] : [])]);
        if (wd === 0 || wd === 6) r.className = "wknd";
        t2.append(r);
      }
      const tf2 = document.createElement("tfoot"); tf2.append(row(["Yhteensä", fmt(Math.round(lc), 0), fmt(Math.round(lh), 0), fmt(Math.round(lc + lh), 0), ...(hasP ? [fmt(ec + eh, 2)] : [])])); t2.append(tf2);
      const s2 = el("div", "scroll"); s2.append(t2); P.append(s2);
    }

    P.append(el("p", "foot", "Kulutus lasketaan peräkkäisten lukemien erotuksesta. Jos lukemien välissä on useampi päivä, kulutus jaetaan niille tasan. Lukemat on tallennettu vain tälle laitteelle."));
  }

  function trendSvg(groups, key, color) {
    const W = 680, H = 150, L = 40, R = 10, T = 18, B = 22;
    const vals = groups.map(g => g[key]), max = Math.max(1, ...vals.filter(v => v != null));
    const raw = max / 3, p10 = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p10, step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p10, top = Math.ceil(max / step) * step;
    const y = (v) => T + (H - T - B) * (1 - v / top), slot = (W - L - R) / groups.length, bw = Math.min(56, slot * .6);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kuukausitrendi">`;
    for (let g = 0; g <= top + 1e-9; g += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="var(--line)"/><text x="${L - 6}" y="${(y(g) + 4).toFixed(1)}" text-anchor="end">${fmt(g, 0)}</text>`;
    const every = Math.max(1, Math.ceil(groups.length / 12));
    groups.forEach((g, i) => {
      const cx = L + i * slot + slot / 2, v = g[key];
      if (v != null && v > 0) {
        const yt = y(v), h = y(0) - yt, x = cx - bw / 2, r = Math.min(4, h);
        s += `<path d="M${x},${y(0)} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${y(0)} Z" fill="${color}" opacity="${g.full ? 1 : .55}"/>`;
        if (groups.length <= 12) s += `<text class="lbl" x="${cx}" y="${(yt - 5).toFixed(1)}" text-anchor="middle">${fmt(Math.round(v), 0)}</text>`;
      }
      if (i % every === 0) { const [yy, mo] = g.k.split("-").map(Number); s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${MONTHS[mo - 1].slice(0, 3)}${mo === 1 || i === 0 ? " " + String(yy).slice(2) : ""}</text>`; }
    });
    return s + `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/></svg>`;
  }
  render();
})();
</script>
